name: Build MIS Gallery Fonts

on:
  push:
    paths:
      - 'svg/**'
      - 'scripts/**'
      - '.github/workflows/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Icon Font and Web Catalog
        run: npm run build

      - name: Commit and push generated font assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MIS Gallery Bot"
          git add dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate MIS Gallery font assets [skip ci]" && git push)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
